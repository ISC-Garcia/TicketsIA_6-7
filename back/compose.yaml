# PostgreSQL para desarrollo y pruebas. Crea las bases `tickets`, `tickets_test` (pytest)
# y `tickets_e2e` (Playwright).
#   docker compose -f back/compose.yaml up -d
# Las credenciales son solo para esta base local; en producción salen de DATABASE_URL.
name: tickets

services:
  db:
    image: docker.io/library/postgres:17
    # pg_stat_statements registra el tiempo de cada consulta para el monitoreo (E9-01).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
      POSTGRES_DB: tickets
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./docker/crear-base-pruebas.sql:/docker-entrypoint-initdb.d/crear-base-pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  datos:
